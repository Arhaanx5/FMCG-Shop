spring.application.name=fmcg-shop


# Server
server.address=0.0.0.0
server.port=8085

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fmcg_shop
spring.datasource.username=postgres
spring.datasource.password=9450

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=false

#swagger
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=false
springdoc.packages-to-scan=com.shop
springdoc.swagger-ui.url=/v3/api-docs




# JWT
app.jwt.secret=fmcg-shop-super-secret-key-2024-must-be-very-long-string
app.jwt.expiration=86400000

# Logging
logging.level.com.shop=DEBUG

# Enable HTTP Response Compression (GZIP)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
