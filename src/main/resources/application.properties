spring.application.name=fmcg-shop


# Server
server.address=0.0.0.0
server.port=8085

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fmcg_shop
spring.datasource.username=postgres
spring.datasource.password=9450

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=false

#swagger
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=false
springdoc.packages-to-scan=com.shop
springdoc.swagger-ui.url=/v3/api-docs




# JWT
app.jwt.secret=fmcg-shop-super-secret-key-2024-must-be-very-long-string
app.jwt.expiration=86400000

# Logging
logging.level.com.shop=WARN

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=FmcgHikariPool

# JPA Performance & Batching
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Enable HTTP Response Compression (GZIP)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Feature Toggles
app.features.ai-enabled=true

# Google Drive Automated Backup
app.backup.enabled=true
app.backup.drive-folder-id=
app.backup.key-path=google-drive-key.json
